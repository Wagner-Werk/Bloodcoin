<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloodcoin Exchange (demo)</title>
<meta name="description" content="Bloodcoin demo exchange: trade BCUS against test dollars. Bloodcoin is still in development. BCUS is not yet available for purchase.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/assets/rollen/fonts.css">
<style>
/* Layout: sticky dark header with a clean tab row (active tab carries a blood drop); below it one parchment sheet. On first open it unrolls downward and the content appears like ink; later tab changes are quick. Single committed dark world. */
:root{
  --night:#090b11; --night-2:#141a29;
  --paper:#f1e8d2; --paper-2:#e3d4b0; --ink:#1f1712; --ink-soft:#6b5a49; --rule:rgba(31,23,18,.14);
  --blood:#9e0f18; --blood-hi:#d0202b; --green:#15633d; --gold:#c9a25a;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{
  background:radial-gradient(ellipse 70% 45% at 50% 0%, rgba(158,15,24,.16), transparent 70%), radial-gradient(ellipse at 50% 0%, var(--night-2), var(--night) 70%);
  background-color:var(--night); background-attachment:fixed;
  color:var(--paper); font:15px/1.55 var(--f-ui); font-feature-settings:"tnum","cv11"; min-height:100%;
  -webkit-font-smoothing:antialiased;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:20; background:#16070a}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{text-align:center; font:500 12px/1.4 var(--f-ui); color:#ecd4a6; background:rgba(158,15,24,.25); border-bottom:1px solid rgba(201,162,90,.22); padding-block:8px}
.banner b{color:var(--gold); font-weight:700; letter-spacing:.1em; margin-right:.5em; font-size:11px}

/* header + tabs */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:rgba(14,10,14,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid rgba(201,162,90,.18)}
.top-in{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:18px; padding-block:12px 4px}
.brand{display:flex; align-items:center; gap:10px; font:700 24px/1 var(--f-display); color:#ecd09a; letter-spacing:.01em; white-space:nowrap}
.brand svg{width:16px; height:22px; filter:drop-shadow(0 0 6px rgba(208,32,43,.6))}
.brand small{font:600 10px var(--f-ui); letter-spacing:.16em; color:var(--gold); border:1px solid rgba(201,162,90,.4); padding:3px 7px; border-radius:20px}
.acct{margin-left:auto; display:flex; gap:16px; font:500 13px var(--f-ui); color:#bfb29a; white-space:nowrap}
.acct b{color:#f4ead6; font-weight:700}
.tabs{max-width:1180px; margin:0 auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset; position:relative; cursor:pointer; flex:none; padding:12px 14px 10px; font:500 14px/1 var(--f-ui); color:#a99d88; letter-spacing:.01em; border-radius:8px; transition:color .2s, background .2s}
.tab:hover{color:#f1e6cf; background:rgba(255,255,255,.04)}
.tab::after{content:""; position:absolute; left:50%; bottom:0; height:2px; width:0; border-radius:2px; background:linear-gradient(90deg,transparent,var(--blood-hi),transparent); transform:translateX(-50%); transition:width .35s cubic-bezier(.2,.8,.2,1)}
.tab[aria-selected="true"]{color:#fff6e6; font-weight:600}
.tab[aria-selected="true"]::after{width:78%}
.drop{position:absolute; left:50%; bottom:-13px; width:11px; height:15px; margin-left:-5.5px; opacity:0; transform-origin:50% 0; pointer-events:none}
.tab[aria-selected="true"] .drop{opacity:1; animation:drip .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drip{0%{transform:translateY(-9px) scale(.2,.1)} 45%{transform:translateY(0) scale(.8,1.25)} 70%{transform:scale(1.08,.9)} 100%{transform:none}}
.tab:focus-visible{outline:2px solid #e2803a; outline-offset:2px}

/* the roll and the sheet */
main{max-width:1180px; margin:0 auto; padding-block:30px 56px}
.scroll{position:relative}
.roll{position:relative; z-index:2; height:0; opacity:0; margin:0 -3px; border-radius:6px;
  background:linear-gradient(180deg,#3e2e1a 0%,#8a7150 9%,#d9c9a4 26%,#fbf5e6 40%,#fffaf0 46%,#ecdfbf 58%,#c2a97c 76%,#7a623e 91%,#33251390 100%);
  box-shadow:0 14px 18px -10px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,250,235,.5);
  transition:height .3s ease, opacity .3s ease, margin .3s ease}
.scroll.rolled .roll{height:40px; opacity:1; margin-top:-4px}
.scroll.rolled.thin .roll{height:24px; transition:height .7s cubic-bezier(.55,.05,.25,1)}
.unroll{position:relative; overflow:hidden; height:0; transition-property:height; transition-timing-function:cubic-bezier(.55,.05,.25,1)}
/* the paper darkens where it curls into the roll */
.unroll::after{content:""; position:absolute; left:0; right:0; bottom:0; height:56px; pointer-events:none; opacity:0;
  background:linear-gradient(180deg, transparent, rgba(90,62,30,.18) 55%, rgba(50,32,14,.42))}
.scroll.rolled .unroll::after{opacity:1}
.paper > *{transition:opacity .18s}
.paper.blank > *{visibility:hidden}
.paper.fade > *{opacity:0}
.paper{
  position:relative; padding:38px clamp(18px,4vw,52px) 30px; color:var(--ink); border-radius:3px;
  background:
    linear-gradient(90deg, rgba(120,84,40,.13), transparent 3%, transparent 97%, rgba(120,84,40,.13)),
    linear-gradient(180deg, rgba(120,84,40,.12), transparent 4%, transparent 96%, rgba(120,84,40,.14)),
    radial-gradient(ellipse at 50% 40%, var(--paper) 60%, var(--paper-2) 100%);
}
.scroll:not(.rolled) .unroll{box-shadow:0 30px 60px -28px rgba(0,0,0,.85), 0 0 0 1px rgba(201,162,90,.15)}
/* flat sheet: a faint lifted corner */
.paper::after{content:""; position:absolute; right:0; bottom:0; width:38px; height:38px; background:linear-gradient(315deg, var(--night) 0 50%, #d9c7a0 50%, #f3ead6 72%); opacity:0; transition:opacity .5s .2s; border-top-left-radius:6px; box-shadow:-3px -3px 6px rgba(0,0,0,.12)}
.scroll:not(.rolled) .paper::after{opacity:1}

.head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; border-bottom:1px solid rgba(31,23,18,.5); padding-bottom:12px; margin-bottom:22px}
.head h1{margin:0; font:700 clamp(30px,4vw,44px)/1 var(--f-display); color:var(--ink); letter-spacing:-.005em; text-wrap:balance}
.head .eb{font:700 10.5px var(--f-ui); letter-spacing:.18em; text-transform:uppercase; color:var(--blood)}
.head .note{margin-left:auto; font:500 12px var(--f-ui); color:var(--ink-soft); background:rgba(31,23,18,.06); padding:4px 10px; border-radius:20px}
h2{margin:0 0 4px; font:700 11px/1.2 var(--f-ui); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}
p{margin:0}
.small{font-size:13.5px; color:var(--ink-soft)}
a{color:var(--blood); font-weight:600; text-underline-offset:3px}

/* layout inside sheets */
.cols{display:grid; gap:28px}
.c3{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}
.c2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.col{display:flex; flex-direction:column; gap:12px; min-width:0}
.col + .col{border-left:1px solid var(--rule); padding-left:28px}
@media (max-width:900px){
  .c3,.c2{grid-template-columns:minmax(0,1fr)}
  .c3 > .col:nth-child(2){order:-1}
  .col + .col, .c3 > .col:first-child{border-left:0; padding-left:0; border-top:1px solid var(--rule); padding-top:22px}
  .c3 > .col:nth-child(2){border-top:0; padding-top:0}
}

/* figures */
.figs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 18px}
.figs span{display:block; font:600 10.5px var(--f-ui); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px}
.figs b{display:block; font:800 clamp(24px,2.4vw,34px)/1 var(--f-ui); letter-spacing:-.035em; color:var(--ink); white-space:nowrap}
.figs .hero b{color:var(--blood); text-shadow:0 0 18px rgba(208,32,43,.25)}
.figs b small{font-size:.5em; font-weight:700; letter-spacing:0; margin-left:2px; color:var(--ink-soft)}
.up{color:var(--green)!important} .down{color:var(--blood)!important}
.figs b.chip::before{content:"\25B2"; font-size:.42em; vertical-align:.45em; margin-right:4px}

/* chart */
.chart-wrap{position:relative; border-radius:6px; background:linear-gradient(180deg, rgba(31,23,18,.035), rgba(31,23,18,0))}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart .grid line{stroke:rgba(31,23,18,.1); stroke-dasharray:2 4}
.chart .ylab{font:600 15px var(--f-ui); fill:var(--ink-soft)}
.chart .line{fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.chart .glint{fill:none; stroke-width:3; stroke-linecap:round; mix-blend-mode:screen}
.chart .area{opacity:0}
.chart .spark{fill:#e7b660}
.chart .tip{font:800 16px var(--f-ui)}
.paper.ink .chart .line{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s cubic-bezier(.6,0,.2,1) var(--d,0s) forwards}
.paper.ink .chart .area{animation:fadein 1s calc(var(--d,0s) + 1.1s) forwards}
.paper.ink .chart .endpt, .paper.ink .chart .tag{opacity:0; animation:fadein .5s calc(var(--d,0s) + 1.5s) forwards}
.chart .area{opacity:1} .paper.ink .chart .area{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.chart .pulse{transform-box:fill-box; transform-origin:center; animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6); opacity:.7} 100%{transform:scale(3.2); opacity:0}}
.chart .spark{animation:twinkle 3s ease-in-out infinite; opacity:0}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4)} 50%{opacity:.95; transform:scale(1)}}
.chart .spark{transform-box:fill-box; transform-origin:center}
.cross{position:absolute; top:0; bottom:0; width:1px; background:rgba(158,15,24,.35); pointer-events:none; opacity:0}
.cross b{position:absolute; top:4px; left:6px; font:700 11px var(--f-ui); color:#fff; background:var(--blood); padding:3px 6px; border-radius:4px; white-space:nowrap}

/* tables */
table{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
th{font:600 10.5px var(--f-ui); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); text-align:left; padding:0 0 8px; border-bottom:1px solid rgba(31,23,18,.4)}
td{padding:7px 0; border-bottom:1px solid var(--rule); font-weight:500}
th.r,td.r{text-align:right}
.ask td:first-child{color:var(--blood); font-weight:700} .bid td:first-child{color:var(--green); font-weight:700}
.depth{background-repeat:no-repeat; background-position:right center}
.ask .depth{background-image:linear-gradient(90deg, rgba(158,15,24,.0), rgba(158,15,24,.16))}
.bid .depth{background-image:linear-gradient(90deg, rgba(31,122,79,.0), rgba(31,122,79,.18))}
.spread td{text-align:center; font:700 16px var(--f-ui); color:var(--ink); border-block:1px solid rgba(31,23,18,.4); padding:10px 0; letter-spacing:-.01em}
.spread small{font:500 11px var(--f-ui); color:var(--ink-soft); margin-left:8px}
.overflow{overflow-x:auto}

/* forms */
.seg{display:flex; background:rgba(31,23,18,.07); border-radius:10px; padding:4px; gap:4px}
.seg button{all:unset; flex:1; text-align:center; cursor:pointer; padding:10px; font:600 14px var(--f-ui); color:var(--ink-soft); border-radius:7px; transition:background .2s, color .2s}
.seg button[aria-pressed="true"]{background:#fffaf0; color:var(--blood); box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-side="buy"][aria-pressed="true"]{color:var(--green)}
.seg button:focus-visible{outline:2px solid #e2803a; outline-offset:-2px}
form{display:flex; flex-direction:column; gap:6px}
label{font:600 10.5px var(--f-ui); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-top:10px}
input{box-sizing:border-box; font:600 17px var(--f-ui); color:var(--ink); background:rgba(255,253,246,.7); border:1px solid rgba(31,23,18,.18); padding:11px 12px; border-radius:8px; width:100%; color-scheme:light; font-variant-numeric:tabular-nums}
input::placeholder{color:rgba(107,90,73,.6); font-weight:500}
input:focus{outline:none; border-color:var(--blood); box-shadow:0 0 0 3px rgba(158,15,24,.15)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.two > div{display:flex; flex-direction:column; gap:6px; min-width:0}
.total{display:flex; justify-content:space-between; align-items:baseline; border-top:1px dashed rgba(31,23,18,.25); margin-top:12px; padding-top:12px; font:600 13px var(--f-ui); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em}
.total b{font:800 26px var(--f-ui); letter-spacing:-.03em; color:var(--ink); text-transform:none}
.btn{all:unset; box-sizing:border-box; cursor:pointer; text-align:center; padding:14px 18px; margin-top:10px; background:linear-gradient(180deg,var(--blood-hi),var(--blood)); color:#fff6e8;
  font:700 14px/1 var(--f-ui); letter-spacing:.04em; border-radius:10px; box-shadow:0 6px 16px -6px rgba(158,15,24,.7)}
.btn:hover{filter:brightness(1.08)}
.btn.buy{background:linear-gradient(180deg,#27935f,var(--green)); box-shadow:0 6px 16px -6px rgba(31,122,79,.7)}
.btn:focus-visible{outline:2px solid #e2803a; outline-offset:2px}
.msg{min-height:1.4em; font:500 13px var(--f-ui); color:var(--blood)}
dl{display:grid; grid-template-columns:max-content 1fr; gap:10px 26px; margin:0; align-items:baseline}
dt{font:500 14px var(--f-ui); color:var(--ink-soft)} dd{margin:0; font:800 22px var(--f-ui); letter-spacing:-.02em}
.addr{word-break:break-all; background:rgba(255,253,246,.6); border:1px dashed rgba(31,23,18,.25); border-radius:8px; padding:12px; font:13px var(--f-mono)}
.rules{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px}
.rules li{display:grid; grid-template-columns:2em 1fr; gap:4px; font-size:14.5px}
.rules .r{font:700 26px/1 var(--f-display); color:var(--blood)}
.wide{max-width:520px}
.foot{margin-top:26px; padding-top:12px; border-top:1px solid var(--rule); display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font:500 11.5px var(--f-ui); color:var(--ink-soft)}

/* ink: the content appears on the sheet */
.paper.ink [data-ink]{animation:ink 1s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.paper.ink [data-wipe]{-webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 55%); mask-image:linear-gradient(180deg,#000 45%,transparent 55%);
  -webkit-mask-size:100% 300%; mask-size:100% 300%; animation:wipe 1.3s ease-out var(--d,0s) both}
@keyframes ink{
  0%{opacity:0; filter:blur(7px) sepia(1) saturate(4) hue-rotate(-30deg); transform:translateY(3px) scale(.99)}
  45%{opacity:.75; filter:blur(1.5px) sepia(1) saturate(5) hue-rotate(-40deg)}
  100%{opacity:1; filter:none; transform:none}
}
@keyframes wipe{from{-webkit-mask-position:0 100%; mask-position:0 100%} to{-webkit-mask-position:0 0; mask-position:0 0}}

@media (max-width:560px){ .two{grid-template-columns:1fr} dl{grid-template-columns:1fr; gap:0} dd{margin-bottom:10px} .acct{display:none} .paper{padding-top:30px} }
@media (prefers-reduced-motion: reduce){ .unroll,.roll{transition:none!important} .paper.ink [data-ink], .paper.ink [data-wipe], .chart *, .tab .drop{animation:none!important; opacity:1} .paper.ink .chart .line{stroke-dasharray:none} }

/* v5 additions */
[hidden]{display:none!important}
.tabs-wrap{position:relative}
.tabs-wrap::after{content:""; position:absolute; right:0; top:0; bottom:16px; width:44px; pointer-events:none; background:linear-gradient(90deg,transparent,rgba(14,10,14,.95)); opacity:0; transition:opacity .2s}
.tabs-wrap.more::after{opacity:1}
.tab .lock{display:inline-block; width:9px; height:11px; margin-left:6px; vertical-align:-1px; opacity:.6}
.tab[data-locked="false"] .lock{display:none}
.ext{font:500 13px var(--f-ui); color:#bfb29a; text-decoration:none; white-space:nowrap}
.ext:hover{color:#fff}
.ghost{all:unset; cursor:pointer; font:600 13px var(--f-ui); color:#f1e6cf; border:1px solid rgba(201,162,90,.4); padding:6px 12px; border-radius:20px}
.ghost:hover{background:rgba(201,162,90,.12)}
.ghost:focus-visible,.gbtn:focus-visible{outline:2px solid #e2803a; outline-offset:2px}
.gbtn{all:unset; box-sizing:border-box; cursor:pointer; font:600 13px var(--f-ui); color:var(--ink); border:1px solid rgba(31,23,18,.3); padding:8px 14px; border-radius:8px; background:rgba(255,253,246,.6); text-align:center}
.gbtn:hover{border-color:var(--blood); color:var(--blood)}
.gbtn.sm{padding:4px 10px; font-size:12px}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px}
.stat .big{font:800 clamp(24px,2.6vw,34px)/1.05 var(--f-ui); letter-spacing:-.03em; margin:6px 0 4px; white-space:nowrap}
.stat .big small{font-size:.48em; font-weight:700; letter-spacing:0; color:var(--ink-soft); margin-left:3px}
.stat .sub{font:500 12.5px var(--f-ui); color:var(--ink-soft)}
.depbox{display:flex; gap:8px; align-items:stretch}
.depbox .addr{flex:1; margin:0}
code{font:12px var(--f-mono); background:rgba(31,23,18,.06); padding:2px 5px; border-radius:4px; word-break:break-all}
.sect{margin-top:30px; padding-top:22px; border-top:1px solid var(--rule)}
.h-mid{font:700 clamp(24px,3vw,32px)/1.1 var(--f-display); margin:0 0 10px}
.lead{font-size:17px; line-height:1.6; max-width:62ch}
.livechip{display:inline-flex; align-items:center; gap:8px; font:600 12px var(--f-ui); color:var(--green); background:rgba(21,99,61,.09); padding:5px 12px; border-radius:20px; margin-bottom:14px}
.livechip i{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(21,99,61,.5); animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 7px rgba(21,99,61,0)} 100%{box-shadow:0 0 0 0 rgba(21,99,61,0)}}
.feats{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.feats span{font:500 12.5px var(--f-ui); background:rgba(31,23,18,.06); padding:5px 11px; border-radius:20px}
.steps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px; margin-top:16px}
.steps > div{display:flex; flex-direction:column; gap:6px}
.steps b.n{font:700 30px/1 var(--f-display); color:var(--blood)}
.steps h3{margin:0; font:700 15px var(--f-ui)}
.steps p{font-size:14px; color:var(--ink-soft)}
.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px}
.g3 h3{margin:0 0 6px; font:700 15px var(--f-ui)}
.g3 p{font-size:14px; color:var(--ink-soft)}
.facts dd{font:600 15px var(--f-ui); letter-spacing:0}
.facts dt{font-size:13.5px}
.disc{margin-top:22px; padding:14px 16px; border-left:3px solid var(--blood); background:rgba(158,15,24,.05); font-size:13.5px}
.status{font:600 11px var(--f-ui); text-transform:uppercase; letter-spacing:.08em; padding:2px 8px; border-radius:20px; background:rgba(31,23,18,.07)}
.status.ok{color:var(--green); background:rgba(21,99,61,.1)} .status.wait{color:#8a5a00; background:rgba(201,140,20,.14)}
td.mono{font:12px var(--f-mono)}
.side-buy{color:var(--green); font-weight:700} .side-sell{color:var(--blood); font-weight:700}
.wfoot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; font:500 13px var(--f-ui); color:var(--ink-soft); margin-top:12px}
.gate{margin-bottom:16px; padding:12px 14px; border-radius:8px; background:rgba(158,15,24,.07); color:var(--blood); font:600 13.5px var(--f-ui)}
.chart .xlab{font:600 15px var(--f-ui); fill:var(--ink-soft)}
.chart-wrap{touch-action:pan-y}
th + th, td + td{padding-left:14px}
.livechip{align-self:flex-start}
.paper.quick .chart .area{animation-delay:calc(var(--d,0s) + .5s)}
.paper.quick .chart .endpt, .paper.quick .chart .tag{animation-delay:calc(var(--d,0s) + .7s)}
/* quick tab change after the first open */
.paper.quick [data-ink]{animation:inkq .45s ease-out var(--d,0s) both}
@keyframes inkq{from{opacity:0; filter:blur(3px)} to{opacity:1; filter:none}}
.paper.quick .chart .line{animation-duration:.8s}
@media (max-width:900px){ .stats,.g3{grid-template-columns:minmax(0,1fr)} .steps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .steps{grid-template-columns:minmax(0,1fr)} .top-in .ext{display:none} .depbox{flex-direction:column} }
</style>
</head>
<body>

    <h3 class="h-mid">A chain that responds to reality</h3>
    <p class="lead" style="font-size:15.5px">Almost every cryptocurrency issues new coins on a rigid schedule, completely detached from what happens in the world. Bloodcoin breaks with that principle. The number of new coins per block follows one of the hardest and most precisely recorded statistics there is: weekly deaths in the United States, published by the CDC. The result is a currency with a fixed maximum supply whose issuance rate is tied to a real, publicly verifiable signal.</p>
    <div class="steps">
      <div><b class="n">1</b><h3>The CDC reports</h3><p>Every week the CDC publishes the number of deaths in the United States. Bloodcoin only uses weeks that are at least 8 weeks old, because recent figures are still being revised.</p></div>
      <div><b class="n">2</b><h3>An oracle signs</h3><p>An oracle reads the figures, signs them cryptographically and writes them into a block. Every node verifies the signature before accepting the block.</p></div>

    <section><h3>Transparency</h3><p>Every transaction, every mortality report and every reward change is public on the chain and visible in the <a href="https://node.bloodcoin-us.com">explorer</a>. The exchange publishes its reserves, so anyone can check that all customer balances are backed by real coins.</p></section>

<script>
(() => {
  const COIN = 1e8, L = 'en-US';
  const tabs = [...document.querySelectorAll('.tab')];
  const tabsEl = document.getElementById('tabs'), tabsWrap = document.getElementById('tabswrap');
  const scroll = document.getElementById('scroll'), unroll = document.getElementById('unroll'), paper = document.getElementById('paper');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DROP = '<svg class="drop" viewBox="0 0 10 14" aria-hidden="true"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4b55"/><stop offset=".55" stop-color="#c3151f"/><stop offset="1" stop-color="#6d0610"/></linearGradient></defs><path d="M5 0C5 0 0 6.5 0 9a5 5 0 0 0 10 0C10 6.5 5 0 5 0z" fill="url(#dg)"/><ellipse cx="3.3" cy="9" rx="1.1" ry="1.8" fill="#fff" opacity=".55"/></svg>';
  tabs.forEach(t => t.insertAdjacentHTML('beforeend', DROP));

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bld = (d) => (d / COIN).toLocaleString(L, { maximumFractionDigits: 8 });
  const usd = (c) => (c / 100).toLocaleString(L, { style: 'currency', currency: 'USD' });
  const price = (c) => (c / 100).toLocaleString(L, { minimumFractionDigits: 2 });
  const when = (t) => new Date(t * 1000).toLocaleString(L, { dateStyle: 'short', timeStyle: 'short' });
  const num = (v) => parseFloat(String(v).replace(',', '.'));
  const STATUS = { open: 'wait', pending: 'wait', filled: 'ok', credited: 'ok', sent: 'ok', cancelled: '', failed: 'bad' };
  const badge = (s, extra) => `<span class="status ${STATUS[s] ?? ''}">${esc(s)}</span>${extra ? ' ' + esc(extra) : ''}`;
  const none = (cols, text) => `<tr><td colspan="${cols}" class="small">${text}</td></tr>`;
  const all = (sel) => document.querySelectorAll(sel);
  const set = (sel, v, html) => all(sel).forEach(n => { if (html) n.innerHTML = v; else n.textContent = v; });

  let me = null, market = null, info = {}, reserves = null, side = 'buy', authMode = 'login';
  let current = null, opened = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  async function api(path, body) {
    const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    const r = await fetch(path, opt);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { status: r.status });
    return j;
  }
  function say(form, text, ok) { const m = form.querySelector('.msg'); if (m) { m.textContent = text; m.style.color = ok ? 'var(--green)' : 'var(--blood)'; } }

  // ---------- chart from recent trades (oldest left)
  function chartSVG(trades) {
    const W = 600, H = 290, pt = 26, pb = 40, pr = 60;
    const pts = trades.slice().reverse().map(t => ({ t: t.created, p: t.price / 100 }));
    if (pts.length < 2) return `<svg class="chart" viewBox="0 0 ${W} 120" role="img" aria-label="No price history yet"><line x1="0" x2="${W}" y1="60" y2="60" stroke="rgba(31,23,18,.25)" stroke-dasharray="4 6"/><text class="xlab" x="${W / 2}" y="48" text-anchor="middle">Price history appears after the first trades</text></svg>`;
    let lo = Math.min(...pts.map(x => x.p)), hi = Math.max(...pts.map(x => x.p));
    const pad = Math.max((hi - lo) * 0.15, 0.01); lo -= pad; hi += pad;
    const x = i => i * (W - pr) / (pts.length - 1);
    const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
    const xy = pts.map((q, i) => [x(i), y(q.p)]);
    let d = 'M' + xy[0];
    for (let i = 1; i < xy.length; i++) { const [x0, y0] = xy[i - 1], [x1, y1] = xy[i], mx = (x0 + x1) / 2; d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
    const [ex, ey] = xy[xy.length - 1], base = H - pb, last = pts[pts.length - 1].p;
    const grid = [0.25, 0.5, 0.75].map(f => lo + (hi - lo) * f).map(v => `<line x1="0" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ylab" x="${W - pr + 8}" y="${y(v) + 5}">${v.toFixed(2)}</text>`).join('');
    const tl = (t) => new Date(t * 1000).toLocaleString(L, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const idx = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);
    const xl = idx.map(i => `<text class="xlab" x="${x(i)}" y="${H - 12}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${tl(pts[i].t)}</text>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price of the last ${pts.length} trades, last ${last.toFixed(2)} dollars">
      <defs>
        <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#5e0a10"/><stop offset=".6" stop-color="#c3151f"/><stop offset="1" stop-color="#ff3b47"/></linearGradient>
        <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3151f" stop-opacity=".32"/><stop offset=".6" stop-color="#c3151f" stop-opacity=".07"/><stop offset="1" stop-color="#c3151f" stop-opacity="0"/></linearGradient>
        <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="-120" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".5" stop-color="#ffe2a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
          <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="${W + 120} 0" dur="3.6s" begin="2s" repeatCount="indefinite"/></linearGradient>
        <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g class="grid">${grid}<line x1="0" x2="${W - pr}" y1="${base}" y2="${base}" style="stroke-dasharray:none; stroke:rgba(31,23,18,.25)"/></g>
      ${xl}
      <path class="area" d="${d} L${ex},${base} L0,${base}Z" fill="url(#ar)"/>
      <path class="line" d="${d}" stroke="url(#ln)" filter="url(#glow)" pathLength="1"/>
      <path class="glint" d="${d}" stroke="url(#gl)"/>
      <g class="endpt"><circle class="pulse" cx="${ex}" cy="${ey}" r="5" fill="#d0202b"/><circle cx="${ex}" cy="${ey}" r="5" fill="#d0202b" stroke="#fff6e6" stroke-width="2"/></g>
      <g class="tag"><rect x="${W - pr + 4}" y="${ey - 14}" width="54" height="28" rx="6" fill="#9e0f18"/><text class="tip" x="${W - pr + 31}" y="${ey + 6}" text-anchor="middle" fill="#fff">${last.toFixed(2)}</text></g>
    </svg><div class="cross"><b></b></div>`;
  }
  function drawChart(wrap) {
    const trades = (market && market.trades) || [];
    wrap.innerHTML = chartSVG(trades);
    const cross = wrap.querySelector('.cross'); if (!cross) return;
    const pts = trades.slice().reverse(), lab = cross.querySelector('b'), svg = wrap.querySelector('svg');
    const at = e => {
      const r = svg.getBoundingClientRect(), plotW = r.width * (540 / 600);
      const i = Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / plotW)) * (pts.length - 1));
      cross.style.left = (i / (pts.length - 1) * plotW) + 'px';
      cross.style.bottom = (r.height * 40 / 290) + 'px';
      cross.style.opacity = 1;
      lab.textContent = '$' + price(pts[i].price) + ' · ' + when(pts[i].created);
      const right = i > pts.length * .6; lab.style.left = right ? 'auto' : '6px'; lab.style.right = right ? '6px' : 'auto';
    };
    wrap.onpointermove = at; wrap.onpointerdown = at;
    wrap.onpointerleave = () => { cross.style.opacity = 0; };
  }

  // ---------- render whatever is on the sheet; called after loads and after a tab change
  function render() {
    all('[data-demo]').forEach(n => n.hidden = info.demo === false);
    if (market) {
      const m = market;
      set('[data-last]', m.last_price ? '$' + price(m.last_price) : '–');
      set('[data-vol]', m.volume_24h ? bld(m.volume_24h) : '0');
      set('[data-range]', m.volume_24h ? `$${price(m.low_24h)}–${price(m.high_24h)}` : '–');
      set('[data-volline]', m.volume_24h ? `24h volume ${bld(m.volume_24h)} BCUS` : 'No trades in the last 24h');
      const depth = Math.max(1, ...m.asks.map(a => a.amount), ...m.bids.map(a => a.amount));
      const row = (a, cls) => `<tr class="${cls}"><td>${price(a.price)}</td><td class="r depth" style="background-size:${(a.amount / depth * 100).toFixed(1)}% 100%">${bld(a.amount)}</td></tr>`;
      set('[data-asks]', m.asks.slice().reverse().map(a => row(a, 'ask')).join('') || none(2, 'No sell offers'), true);
      set('[data-bids]', m.bids.map(a => row(a, 'bid')).join('') || none(2, 'No buy bids'), true);
      set('[data-spread]', m.asks.length && m.bids.length ? `${m.last_price ? '$' + price(m.last_price) : ''}<small>spread $${price(m.asks[0].price - m.bids[0].price)}</small>` : 'Spread –', true);
      set('[data-trades]', m.trades.map((t, i) => {
        const prev = m.trades[i + 1], cls = prev && t.price < prev.price ? 'ask' : 'bid';
        return `<tr class="${cls}"><td>${price(t.price)}</td><td class="r">${bld(t.amount)}</td><td class="r">${new Date(t.created * 1000).toLocaleTimeString(L, { hour: '2-digit', minute: '2-digit' })}</td></tr>`;
      }).join('') || none(3, 'None yet'), true);
      paper.querySelectorAll('[data-chart]').forEach(w => { if (w.dataset.drawn !== String(m.trades.length + ':' + (m.last_price || 0))) { w.dataset.drawn = m.trades.length + ':' + (m.last_price || 0); drawChart(w); } });
    }
    if (info.node) set('[data-height]', 'Network live · Block ' + info.node.height.toLocaleString(L));
    else if (info.demo !== undefined) set('[data-height]', 'Node offline');
    if (info.confirmations) set('[data-conf]', info.confirmations);
    if (info.withdraw_fee !== undefined) set('[data-fee]', bld(info.withdraw_fee));
    const mo = info.node && info.node.mortality;
    set('[data-mort]', !info.node ? 'Node unreachable' : mo && mo.week_ending
      ? `Week ending ${esc(mo.week_ending)}: <b>${mo.deaths.toLocaleString(L)}</b> deaths (${mo.change_pct > 0 ? '+' : ''}${mo.change_pct.toLocaleString(L)}% vs. previous week) · reward factor <b>${mo.reward_factor.toLocaleString(L)}</b>`
      : `No report yet · reward factor ${mo ? mo.reward_factor.toLocaleString(L, { minimumFractionDigits: 3 }) : '–'}`, true);
    if (reserves) set('[data-res]', reserves.covered ? '<span class="up">fully backed ✓</span>' : '<span class="down">underfunded</span>', true);
    if (!me) return;
    const b = me.balances;
    set('[data-hd-usd]', usd(b.USD.available)); set('[data-hd-bcus]', bld(b.BCUS.available));
    set('[data-bcus]', bld(b.BCUS.available)); set('[data-usd]', usd(b.USD.available));
    set('[data-bcuslock]', b.BCUS.locked ? `+ ${bld(b.BCUS.locked)} BCUS in orders/withdrawals` : 'available');
    set('[data-usdlock]', b.USD.locked ? `+ ${usd(b.USD.locked)} in buy orders` : 'available');
    set('[data-addr]', me.deposit_address); set('[data-avail]', bld(b.BCUS.available));
    set('[data-myorders]', me.orders.map(o => `<tr><td class="side-${o.side}">${o.side === 'buy' ? 'Buy' : 'Sell'}</td>
      <td class="r">$${price(o.price)}</td><td class="r">${bld(o.amount)}</td><td class="r">${bld(o.remaining)}</td><td>${badge(o.status)}</td>
      <td class="r">${o.status === 'open' ? `<button class="gbtn sm" type="button" data-cancel="${+o.id}">Cancel</button>` : ''}</td></tr>`).join('') || none(6, 'No orders'), true);
    set('[data-wlist]', me.withdrawals.map(w => `<tr><td>${when(w.created)}</td><td class="mono">${esc(w.address.slice(0, 14))}…</td>
      <td class="r">${bld(w.amount)}</td><td>${badge(w.status, w.error ? ': ' + w.error : '')}</td>
      <td class="mono">${w.txid ? `<a href="https://node.bloodcoin-us.com/#/tx/${esc(w.txid)}">${esc(w.txid.slice(0, 16))}…</a>` : '–'}</td></tr>`).join('') || none(5, 'None yet'), true);
    set('[data-dlist]', me.deposits.map(d => `<tr><td>${when(d.created)}</td><td class="r">${bld(d.amount)}</td><td class="r">${esc(d.height)}</td>
      <td>${badge(d.status)}</td><td class="mono">${esc(String(d.txid).slice(0, 16))}…</td></tr>`).join('') || none(5, 'None yet'), true);
    set('[data-mytrades]', me.trades.map(t => `<tr><td>${when(t.created)}</td><td class="side-${t.side}">${t.side === 'buy' ? 'Buy' : 'Sell'}</td>
      <td class="r">${price(t.price)}</td><td class="r">${bld(t.amount)}</td></tr>`).join('') || none(4, 'None yet'), true);
  }

  // ---------- data
  async function loadMe() { try { me = await api('/api/me'); } catch (e) { me = null; } syncAuth(); }
  async function loadMarket() { market = await api('/api/market'); }
  async function loadInfo() { info = await api('/api/info'); }
  async function loadReserves() { reserves = await api('/api/reserves'); }
  async function refresh() { await Promise.all([loadMe(), loadMarket().catch(() => {}), loadInfo().catch(() => {})]); render(); }

  // ---------- sheets and tabs
  function foot(name) {
    return `<div class="foot"><span>exchange.bloodcoin-us.com/#${name}</span><span><a href="https://bloodcoin-us.com/whitepaper">Whitepaper &amp; legal</a>${info.demo === false ? '' : ' · Demo with test money'}</span></div>`;
  }
  function inkTargets() {
    const out = [];
    const walk = el => { for (const c of el.children) { if (c.matches('.cols, .col, form, .head, .figs, .sect, .stats, .g3')) walk(c); else out.push(c); } };
    walk(paper);
    return out;
  }
  function fill(name, quick) {
    paper.classList.remove('ink', 'quick');
    paper.innerHTML = document.getElementById('s-' + name).innerHTML + foot(name);
    paper.querySelectorAll('[data-out-only]').forEach(n => n.hidden = !!me);
    render();
    if (reduce) return;
    inkTargets().forEach((el, i) => {
      el.style.setProperty('--d', (quick ? Math.min(i * 25, 250) : Math.min(i * 70, 1100)) + 'ms');
      el.setAttribute(!quick && el.matches('.overflow, table') ? 'data-wipe' : 'data-ink', '');
    });
  }
  function syncAuth() {
    const on = !!me;
    all('[data-in]').forEach(n => n.hidden = !on);
    all('[data-out-only]').forEach(n => n.hidden = on);
    tabs.forEach(t => { if (t.hasAttribute('data-auth')) t.hidden = !on; });
    overflowHint();
  }
  function overflowHint() { tabsWrap.classList.toggle('more', tabsEl.scrollWidth - tabsEl.clientWidth - tabsEl.scrollLeft > 4); }
  tabsEl.addEventListener('scroll', overflowHint, { passive: true });
  addEventListener('resize', overflowHint);

  function show(name, first) {
    if (!document.getElementById('s-' + name)) name = me ? 'trade' : 'about';
    let gated = false;
    const tab = tabs.find(t => t.dataset.scroll === name);
    if (tab && tab.hasAttribute('data-auth') && !me) { name = 'login'; gated = true; }
    if (name === 'login' && me) name = 'trade';
    if (name === current && !gated) return;
    current = name;
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.scroll === name)));
    const sel = tabs.find(t => t.dataset.scroll === name);
    if (sel && !sel.hidden) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    timers.forEach(clearTimeout); timers = [];
    const after = () => { const g = paper.querySelector('[data-gate]'); if (g) g.hidden = !gated; };
    if (reduce) { fill(name); after(); scroll.classList.remove('rolled'); unroll.style.height = 'auto'; return; }
    if (opened) {
      paper.classList.add('fade');
      later(() => { paper.classList.remove('fade'); fill(name, true); after(); paper.classList.add('ink', 'quick'); }, 140);
      return;
    }
    // first open: the blank sheet unrolls downward, then the ink appears
    opened = true;
    fill(name); after();
    paper.classList.add('blank');
    later(() => {
      const target = Math.min(paper.offsetHeight, Math.max(260, innerHeight - unroll.getBoundingClientRect().top - 70));
      scroll.classList.add('thin');
      unroll.style.transitionDuration = '800ms';
      unroll.style.height = target + 'px';
      later(() => {
        scroll.classList.remove('rolled', 'thin');
        unroll.style.transitionDuration = '0ms'; unroll.style.height = 'auto';
        paper.classList.remove('blank'); paper.classList.add('ink');
      }, 820);
    }, first ? 300 : 0);
  }
  const go = name => { show(name); try { history.replaceState(null, '', '#' + current); } catch (e) {} };
  tabs.forEach(t => t.addEventListener('click', () => go(t.dataset.scroll)));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  tabsEl.addEventListener('keydown', e => {
    const vis = tabs.filter(t => !t.hidden), i = vis.findIndex(t => t.dataset.scroll === current);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const n = vis[(i + (e.key === 'ArrowRight' ? 1 : vis.length - 1)) % vis.length];
      n.focus(); n.click();
    }
  });
  document.querySelector('[data-golog]').addEventListener('click', () => go('login'));
  document.querySelector('[data-logout]').addEventListener('click', async () => {
    try { await api('/api/logout', {}); } catch (e) {}
    me = null; syncAuth(); go('about');
  });

  // ---------- actions on the sheet
  paper.addEventListener('click', async e => {
    const b = e.target.closest('[data-side],[data-auth]');
    if (b) {
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      if (b.dataset.side) {
        side = b.dataset.side;
        const btn = paper.querySelector('[data-orderbtn]');
        btn.textContent = side === 'buy' ? 'Buy BCUS' : 'Sell BCUS';
        btn.classList.toggle('buy', side === 'buy');
      } else {
        authMode = b.dataset.auth;
        paper.querySelector('[data-authbtn]').textContent = authMode === 'login' ? 'Log in' : 'Create account';
        paper.querySelector('[data-pwhint]').hidden = authMode === 'login';
        paper.querySelector('#a-pw').autocomplete = authMode === 'login' ? 'current-password' : 'new-password';
      }
    }
    const c = e.target.closest('[data-cancel]');
    if (c) {
      c.disabled = true;
      try { await api('/api/cancel', { id: +c.dataset.cancel }); await refresh(); } catch (err) { alert(err.message); c.disabled = false; }
    }
    if (e.target.closest('[data-testmoney]')) {
      const m = paper.querySelector('[data-tmmsg]');
      try { await api('/api/testmoney', {}); m.textContent = '$1,000 test money credited'; m.style.color = 'var(--green)'; await refresh(); }
      catch (err) { m.textContent = err.message; m.style.color = 'var(--blood)'; }
    }
    const cp = e.target.closest('[data-copy]');
    if (cp) {
      const done = () => { cp.textContent = 'Copied ✓'; setTimeout(() => { cp.textContent = 'Copy'; }, 1600); };
      try { navigator.clipboard.writeText(me.deposit_address).then(done, () => {}); } catch (err) {}
    }
    if (e.target.closest('[data-goreg]')) {
      go('login');
      later(() => { const r = paper.querySelector('[data-auth="register"]'); if (r) r.click(); const em = paper.querySelector('#a-email'); if (em) em.focus({ preventScroll: true }); }, 200);
    }
  });
  paper.addEventListener('input', e => {
    const f = e.target.closest('[data-form="order"]'); if (!f) return;
    const t = num(f.querySelector('#o-price').value) * num(f.querySelector('#o-amt').value);
    f.querySelector('[data-total]').textContent = isFinite(t) && t > 0 ? t.toLocaleString(L, { style: 'currency', currency: 'USD' }) : '–';
  });
  paper.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      if (f.dataset.form === 'auth') {
        await api('/api/' + authMode, { email: f.querySelector('#a-email').value, password: f.querySelector('#a-pw').value });
        f.querySelector('#a-pw').value = '';
        await refresh(); go('trade');
      } else if (f.dataset.form === 'order') {
        await api('/api/order', { side, price: f.querySelector('#o-price').value, amount: f.querySelector('#o-amt').value });
        say(f, 'Order accepted', true); f.querySelector('#o-amt').value = ''; f.querySelector('[data-total]').textContent = '–';
        await refresh();
      } else if (f.dataset.form === 'withdraw') {
        const to = f.querySelector('#w-to').value.trim(), amt = f.querySelector('#w-amt').value.trim();
        if (!confirm(`Withdraw ${amt} BCUS to ${to}? This cannot be undone.`)) return;
        await api('/api/withdraw', { address: to, amount: amt });
        say(f, 'Withdrawal requested', true); f.querySelector('#w-amt').value = '';
        await refresh();
      }
    } catch (err) { say(f, err.message); }
    finally { btn.disabled = false; }
  });

  // ---------- start
  (async () => {
    await Promise.all([loadMe(), loadMarket().catch(() => {}), loadInfo().catch(() => {}), loadReserves().catch(() => {})]);
    show(location.hash.slice(1) || (me ? 'trade' : 'about'), true);
    setInterval(async () => {
      if (document.hidden) return;
      await Promise.all([me ? loadMe() : Promise.resolve(), loadMarket().catch(() => {}), loadInfo().catch(() => {})]);
      if (!me && tabs.find(t => t.dataset.scroll === current && t.hasAttribute('data-auth'))) go('login');
      render();
    }, 8000);
  })();
})();
</script>
</body>
</html>
